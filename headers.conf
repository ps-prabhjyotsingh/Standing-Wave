# Included by every location in nginx.conf. nginx drops inherited add_header
# directives from any block that sets one of its own, so they live in a file.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Written at image build time by scripts/csp-header.mjs, from the built output.
include /etc/nginx/csp.conf;
