# Builds the site image and publishes it to GitHub Container Registry on every push
# to main. The Dockerfile runs the full verification (link check, stills, CSP
# generation, nginx -t) inside the build, so a broken site can't produce an image.

name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: true

env:
  SITE_URL: https://standingwave.life # the one place the domain lives; change it here

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 only: the swarm node is amd64, and the arm64 leg under QEMU
          # took over an hour for no consumer. Add it back if one appears.
          platforms: linux/amd64
          push: true
          build-args: |
            SITE_URL=${{ env.SITE_URL }}
          tags: |
            ghcr.io/ps-prabhjyotsingh/standing-wave:latest
            ghcr.io/ps-prabhjyotsingh/standing-wave:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy is deliberately MANUAL: it runs only on workflow_dispatch, never on a
  # push. The weekly routine accumulates fragments in the repo and the owner ships
  # them in batches when he feels like it (DECISIONS.md, 2026-09-17).
  #
  # The cost of that choice is the gap this job was written to close: content can
  # sit unshipped and nothing complains. The guard is that the weekly run reports
  # how far behind the live site is, so the backlog is visible in the place the
  # owner already looks.
  deploy:
    needs: image
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the new image to the swarm
        env:
          SSH_KEY: ${{ secrets.SWARM_SSH_KEY }}
          SWARM_HOST: ${{ secrets.SWARM_HOST }}
          SWARM_USER: ${{ secrets.SWARM_USER }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ] || [ -z "${SWARM_HOST:-}" ]; then
            echo "::warning::Swarm deploy secrets not set — image published but NOT deployed."
            echo "Set SWARM_SSH_KEY, SWARM_HOST and SWARM_USER to enable deployment."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$SWARM_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # The key is pinned server-side to a forced command that accepts only a
          # 40-char hex SHA, so this is the entire vocabulary available to it.
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            "${SWARM_USER:-deploy}@${SWARM_HOST}" "${{ github.sha }}"

      - name: Confirm the deployed site serves this commit
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if curl -fsS https://standingwave.life/ >/dev/null 2>&1; then
              echo "site responding"; exit 0
            fi
            sleep 10
          done
          echo "::error::Site did not respond after deploy"; exit 1
