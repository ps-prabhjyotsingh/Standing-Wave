# On every push to main: builds the site image, publishes it to GitHub Container
# Registry, and deploys it to the swarm. The Dockerfile runs the full verification
# (link check, stills, CSP generation, nginx -t) inside the build, so a broken site
# can't produce an image, and the deploy job only runs if the image job passed.

name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# Don't cancel a run in progress: it may be partway through a rolling update.
# A newer push waits, and replaces any older run still waiting.
concurrency:
  group: publish
  cancel-in-progress: false

env:
  SITE_URL: https://standingwave.life # the one place the domain lives; change it here

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 only: the swarm node is amd64, and the arm64 leg under QEMU
          # took over an hour for no consumer. Add it back if one appears.
          platforms: linux/amd64
          push: true
          build-args: |
            SITE_URL=${{ env.SITE_URL }}
          tags: |
            ghcr.io/ps-prabhjyotsingh/standing-wave:latest
            ghcr.io/ps-prabhjyotsingh/standing-wave:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Every push to main goes live (owner's decision, DECISIONS.md 2026-11-16).
  # workflow_dispatch redeploys the current commit by hand.
  #
  # This job must never pass without deploying. It ran green once in September
  # while doing nothing: the secrets were empty, it warned and exited 0, and the
  # "confirmation" curled a site that was serving an old image. So missing
  # secrets now fail the job, and the server-side command (scripts/
  # swarm-deploy-setup.sh) exits 0 only once every replica runs this SHA.
  deploy:
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy this commit to the swarm
        env:
          SSH_KEY: ${{ secrets.SWARM_SSH_KEY }}
          SWARM_HOST: ${{ secrets.SWARM_HOST }}
          SWARM_USER: ${{ secrets.SWARM_USER }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ] || [ -z "${SWARM_HOST:-}" ]; then
            echo "::error::SWARM_SSH_KEY / SWARM_HOST not set. The image was published but is NOT live. See DEPLOY.md."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$SWARM_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # The key is pinned server-side to a forced command that accepts only a
          # 40-char hex SHA, so this is the entire vocabulary available to it.
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            "${SWARM_USER:-sw-deploy}@${SWARM_HOST}" "${{ github.sha }}"

      - name: Confirm the site answers
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl -fsS "$SITE_URL/" >/dev/null 2>&1; then
              echo "site responding"; exit 0
            fi
            sleep 10
          done
          echo "::error::Site did not respond after deploy"; exit 1
