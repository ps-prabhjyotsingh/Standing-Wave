# Builds the site image and publishes it to GitHub Container Registry on every push
# to main. The Dockerfile runs the full verification (link check, stills, CSP
# generation, nginx -t) inside the build, so a broken site can't produce an image.

name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SITE_URL: https://standingwave.life # the one place the domain lives; change it here

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SITE_URL=${{ env.SITE_URL }}
          tags: |
            ghcr.io/ps-prabhjyotsingh/standing-wave:latest
            ghcr.io/ps-prabhjyotsingh/standing-wave:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
