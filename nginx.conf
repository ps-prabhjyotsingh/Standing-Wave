# Standing Wave — the whole server. Flat files, no logs of anyone's visit.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30;
  server_tokens off;

  # The site promises no tracking. An access log is a record of who visited and
  # when, so there isn't one. Errors are still logged; they are about the server.
  access_log off;

  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml;

  server {
    listen 80;
    listen [::]:80;
    server_name _;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build output: the filename changes when the content does.
    location /_astro/ {
      include /etc/nginx/headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # Stills and social images: stable names, so a day is long enough.
    location ~ ^/(stills|og)/ {
      include /etc/nginx/headers.conf;
      add_header Cache-Control "public, max-age=86400" always;
      try_files $uri =404;
    }

    location / {
      include /etc/nginx/headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
      include /etc/nginx/headers.conf;
      add_header Cache-Control "no-cache" always;
      internal;
    }
  }
}
